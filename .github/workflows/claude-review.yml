name: Claude Review

# Review on request. Nothing runs by itself: a comment containing `@claude`
# starts a run — on a pull request, in an inline thread, or on an issue. A
# push therefore costs nothing, and a second look stays a deliberate choice.
#
#   @claude review          — full review of the pull request
#   @claude <question>      — a targeted question about one place
#   @claude <instruction>   — on an issue: Claude rewrites the issue's title
#                             and body itself (`.github/scripts/edit-issue.sh`)
#
# The run comments and does not write to the branch (`contents: read`). It
# may edit an issue — the triggering one only, title and body only, and only
# through `.github/scripts/edit-issue.sh` in the default branch's version;
# `gh issue edit` itself is not allowed, because a prefix rule could not rule
# out labels, assignees and other issues. The issue's edit history keeps the
# previous version.
# Letting Claude push fixes would make that `contents: write` — a deliberate
# widening of permissions, not a detail.

on:
    issue_comment:
        types: [created]
    pull_request_review_comment:
        types: [created]
    pull_request_review:
        types: [submitted]

concurrency:
    group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
    cancel-in-progress: false

jobs:
    claude:
        # Without this condition every comment in the repository started a run.
        if: |
            (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
            (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
            (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
            issues: write
            id-token: write
            # So the review can read the pull request's CI results.
            actions: read
        steps:
            - name: Check out saasicat
              uses: actions/checkout@v6
              with:
                  fetch-depth: 1

            # Write access is measured, not read off `author_association`:
            # MEMBER only means organisation member, COLLABORATOR can be
            # read-only. The action checks the same thing, but sits behind the
            # moving `@v1` — since the run may edit issues, the check also
            # lives here, before the first step that uses the token.
            - name: Check the requester's write access
              env:
                  GH_TOKEN: ${{ github.token }}
                  ACTOR: ${{ github.actor }}
              run: |
                  set -euo pipefail
                  level=$(gh api "repos/${{ github.repository }}/collaborators/${ACTOR}/permission" --jq '.permission' 2>/dev/null || echo "unknown")
                  case "$level" in
                      admin|write) echo "write access: ${level}" ;;
                      *) echo "::error::${ACTOR} has no write access to the repository (${level}) — the run ends here."; exit 1 ;;
                  esac

            # The brief applies in the version on the default branch, not the
            # one under review. Two reasons: the PR branch is what gets checked
            # out, and the file only exists there once it is merged — the review
            # otherwise ran without its own standard. And a PR should not be
            # able to rewrite the criteria it is measured against.
            - name: Take the brief from the default branch
              env:
                  GH_TOKEN: ${{ github.token }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  set -euo pipefail
                  mkdir -p .github
                  gh api "repos/${{ github.repository }}/contents/.github/claude-review-context.md?ref=$DEFAULT_BRANCH" \
                      --header "Accept: application/vnd.github.raw" \
                      > .github/claude-review-context.md
                  wc -l .github/claude-review-context.md

            # The issue script comes from the default branch like the brief and
            # lives outside the working tree: on a pull-request event the PR
            # merge is checked out, and a rule pointing into the working tree
            # would run the PR's version — arbitrary shell with `issues: write`.
            # If it is not there yet (the PR that brings it), the review goes
            # on without the capability and says so.
            - name: Take the issue script from the default branch
              env:
                  GH_TOKEN: ${{ github.token }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  set -euo pipefail
                  target="$RUNNER_TEMP/edit-issue.sh"
                  if ! gh api "repos/${{ github.repository }}/contents/.github/scripts/edit-issue.sh?ref=$DEFAULT_BRANCH" \
                      --header "Accept: application/vnd.github.raw" > "$target" 2>/dev/null || [ ! -s "$target" ]; then
                      rm -f "$target"
                      echo "::warning::.github/scripts/edit-issue.sh does not exist on $DEFAULT_BRANCH — a request cannot edit an issue in this run."
                      exit 0
                  fi
                  chmod 755 "$target"
                  echo "Issue script: $(wc -l < "$target") lines from $DEFAULT_BRANCH"

            - name: Run Claude
              uses: anthropics/claude-code-action@v1
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

                  # Without this the action exchanges an OIDC token for an app
                  # token and needs the Claude GitHub App installed on the repo.
                  # Installing it requires a Team/Enterprise plan; supplying the
                  # workflow's own token skips the exchange. The permissions
                  # above are enough for a run that only comments.
                  github_token: ${{ secrets.GITHUB_TOKEN }}

                  # The standard lives in the repository, not here: the review
                  # reads it fresh on every run. A copy in this place would be
                  # the same rule a second time — and the first to go stale.
                  #
                  # The language is named here as well as in the brief, because
                  # a model answers in the language it is instructed in: the
                  # brief and this prompt used to be German, and so were the
                  # reviews — on a source-available project read in English.
                  claude_args: |
                      --model claude-opus-5
                      --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr checks:*),Bash(gh issue view:*),Bash(${{ runner.temp }}/edit-issue.sh:*),Bash(gh run view:*)"
                      --append-system-prompt "Binding for this run: write everything you post — findings, summary, inline comments, questions — in English, whatever language the pull request or the comment you are answering is in. Then read .github/claude-review-context.md first and follow it before doing anything else. If the request is to change the issue itself, the only way is ${{ runner.temp }}/edit-issue.sh (--title, --body-file with a file inside the workspace); the rules for it are in the brief."
