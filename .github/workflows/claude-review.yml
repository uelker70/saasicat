name: Claude Review

# Review on request. Nothing runs by itself: a comment containing `@claude`
# starts a run — on a pull request, in an inline thread, or on an issue. A
# push therefore costs nothing, and a second look stays a deliberate choice.
#
#   @claude review          — full review of the pull request
#   @claude <question>      — a targeted question about one place
#
# The run comments and does not write to the branch (`contents: read`).
# Letting Claude push fixes would make that `contents: write` — a deliberate
# widening of permissions, not a detail.

on:
    issue_comment:
        types: [created]
    pull_request_review_comment:
        types: [created]
    pull_request_review:
        types: [submitted]

concurrency:
    group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
    cancel-in-progress: false

jobs:
    claude:
        # Without this condition every comment in the repository started a run.
        if: |
            (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
            (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
            (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
            issues: write
            id-token: write
            # So the review can read the pull request's CI results.
            actions: read
        steps:
            - name: Check out saasicat
              uses: actions/checkout@v6
              with:
                  fetch-depth: 1

            # The brief applies in the version on the default branch, not the
            # one under review. Two reasons: the PR branch is what gets checked
            # out, and the file only exists there once it is merged — the review
            # otherwise ran without its own standard. And a PR should not be
            # able to rewrite the criteria it is measured against.
            - name: Take the brief from the default branch
              env:
                  GH_TOKEN: ${{ github.token }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  set -euo pipefail
                  mkdir -p .github
                  gh api "repos/${{ github.repository }}/contents/.github/claude-review-context.md?ref=$DEFAULT_BRANCH" \
                      --header "Accept: application/vnd.github.raw" \
                      > .github/claude-review-context.md
                  wc -l .github/claude-review-context.md

            - name: Run Claude
              uses: anthropics/claude-code-action@v1
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

                  # Without this the action exchanges an OIDC token for an app
                  # token and needs the Claude GitHub App installed on the repo.
                  # Installing it requires a Team/Enterprise plan; supplying the
                  # workflow's own token skips the exchange. The permissions
                  # above are enough for a run that only comments.
                  github_token: ${{ secrets.GITHUB_TOKEN }}

                  # The standard lives in the repository, not here: the review
                  # reads it fresh on every run. A copy in this place would be
                  # the same rule a second time — and the first to go stale.
                  #
                  # The language is named here as well as in the brief, because
                  # a model answers in the language it is instructed in: the
                  # brief and this prompt used to be German, and so were the
                  # reviews — on a source-available project read in English.
                  claude_args: |
                      --model claude-opus-5
                      --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr checks:*),Bash(gh issue view:*),Bash(gh run view:*)"
                      --append-system-prompt "Binding for this run: write everything you post — findings, summary, inline comments, questions — in English, whatever language the pull request or the comment you are answering is in. Then read .github/claude-review-context.md first and follow it before doing anything else."
