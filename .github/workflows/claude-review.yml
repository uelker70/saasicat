name: Claude Review

# Review auf Zuruf. Es läuft nichts von allein: Erst ein Kommentar mit
# `@claude` startet einen Lauf — auf einem PR, in einer Inline-Diskussion oder
# an einem Issue. Damit kostet ein Nachpushen nichts, und ein zweiter Blick
# bleibt eine bewusste Entscheidung.
#
#   @claude review          — vollständige Durchsicht des PR
#   @claude <frage>         — gezielte Rückfrage zu einer Stelle
#
# Der Lauf kommentiert und schreibt nicht in den Branch (`contents: read`).
# Soll Claude auch Korrekturen pushen dürfen, wird daraus `contents: write` —
# das ist eine bewusste Rechteerweiterung, keine Nebensache.

on:
    issue_comment:
        types: [created]
    pull_request_review_comment:
        types: [created]
    pull_request_review:
        types: [submitted]

concurrency:
    group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
    cancel-in-progress: false

jobs:
    claude:
        # Ohne diese Bedingung startete jeder Kommentar im Repo einen Lauf.
        if: |
            (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
            (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
            (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
            issues: write
            id-token: write
            # Damit die Review die CI-Ergebnisse des PR mitlesen kann.
            actions: read
        steps:
            - name: Check out saasicat
              uses: actions/checkout@v6
              with:
                  fetch-depth: 1

            - name: Run Claude
              uses: anthropics/claude-code-action@v1
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

                  # Der Maßstab steht im Repo, nicht hier: Die Review liest ihn
                  # bei jedem Lauf frisch. Eine Kopie an dieser Stelle wäre
                  # dieselbe Regel ein zweites Mal — und veraltete als Erstes.
                  claude_args: |
                      --model claude-opus-5
                      --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr checks:*),Bash(gh issue view:*),Bash(gh run view:*)"
                      --append-system-prompt "Verbindlich fuer diesen Lauf: Lies zuerst .github/claude-review-context.md und folge ihr, bevor du irgendetwas anderes tust."
