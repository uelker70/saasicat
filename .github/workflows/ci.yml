name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    # Pure source analysis — needs neither install nor build, so it runs
    # separately and in parallel. The configuration lives in .jscpd.json so a
    # local run (`pnpm dlx jscpd`) measures exactly what CI does. maxLines is
    # the value that matters there: at the default of 1000 jscpd silently skips
    # larger files and measures past the very places duplication collects in.
    duplication:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            # pnpm from its own action, not from `corepack enable`: Corepack
            # downloads the version in `packageManager` on first use, and that
            # download failed four runs in a row on 2026-08-23 with an undici
            # assertion before jscpd ever started. The action reads the same
            # `packageManager` field and caches the binary.
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - name: Duplication check
              run: pnpm dlx jscpd@4
            - name: Upload duplication report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: jscpd-report
                  path: .jscpd-report/
                  # Without this the step uploads nothing: `.jscpd-report/`
                  # starts with a dot, and upload-artifact has excluded hidden
                  # files by default since v4.4. Paired with
                  # `if-no-files-found: ignore`, that failed silently.
                  include-hidden-files: true
                  if-no-files-found: ignore

    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5
            - name: Enable corepack
              run: corepack enable
            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build packages
              run: pnpm -r build
            # The unit suites run ONCE, under coverage: the ratchet spawns each
            # package's suite itself and fails on a red test before it compares
            # a number, so a second plain run would measure nothing new and cost
            # ~80 s. It does not rebuild either — `build-if-stale` reads the
            # stamps the build step above just wrote. A ratchet, not a target:
            # it fails only when coverage DROPS below coverage-baseline.json.
            - name: Run unit tests under the coverage ratchet
              run: pnpm run coverage
            # Uploaded even when the step above fails — that is precisely when
            # someone needs the numbers to see WHICH package dropped and by how
            # much, without re-running the suite locally.
            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-report
                  path: coverage-report.json
                  if-no-files-found: warn
            # The one suite the ratchet does not measure: the example's own.
            - name: Run the example's tests
              run: pnpm --filter notesapp-example test
            # Checks that span the whole workspace rather than one package —
            # they need every dist/ present, so they cannot live in a package
            # suite without breaking `pnpm --filter <pkg> test` on a clean
            # checkout.
            - name: Run repo-wide checks
              run: pnpm run test:repo
            # SFC templates are invisible to the unit tests, which run against the
            # built dist/. This covers the decisions components make while rendering.
            - name: Run component tests
              run: pnpm --filter @saasicat/ui-vue test:component
            # The tenant package ships source only, so this runner is its whole
            # test surface; nothing else in the workspace reaches its tests.
            - name: Run component tests (tenant package)
              run: pnpm --filter @saasicat/ui-vue-tenant test:component
            # Eight ui-vue subpaths ship .vue/.ts as source, so the consumer's
            # tsconfig compiles them — not ours. This holds them to the oldest
            # lib a consumer uses.
            - name: Typecheck the shipped source at the support floor
              run: pnpm --filter @saasicat/ui-vue test:shipped-source
            # Same floor, same promise — and this package ships NOTHING but
            # source, so without this step 100 % of its surface went unmeasured.
            - name: Typecheck the tenant package's shipped source at the floor
              run: pnpm --filter @saasicat/ui-vue-tenant test:shipped-source
            - name: Lint
              run: pnpm exec eslint .
            # Prettier is configured; without this nothing makes a diff obey it.
            - name: Check formatting
              run: pnpm run format:check
            - name: Typecheck
              run: pnpm -r typecheck
            # The example is the schema consumers copy from, so it must not fall
            # behind the fragments it demonstrates. Exits 1 on drift.
            - name: Schema drift (NotesApp example)
              run: >
                  node packages/cli/bin/saasicat.js schema check
                  --prisma-schema=examples/notesapp/prisma/schema.prisma

    persistence-contract:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_PASSWORD: test
                    POSTGRES_DB: saasicat_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - name: Checkout
              uses: actions/checkout@v5
            - name: Enable corepack
              run: corepack enable
            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build adapters and their workspace dependencies
              run: pnpm --filter "@saasicat/adapter-prisma..." --filter "@saasicat/adapter-drizzle..." build
            - name: Run persistence contract against PostgreSQL (adapter-prisma)
              env:
                  SAASICAT_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/saasicat_test
              run: pnpm --filter "@saasicat/adapter-prisma" test:integration
            - name: Run persistence contract against PostgreSQL (adapter-drizzle)
              env:
                  SAASICAT_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/saasicat_test
              run: pnpm --filter "@saasicat/adapter-drizzle" test:integration

            # The ratchet's other half. The coverage step in `build-and-test`
            # has no database, so for these two packages it measures the suites
            # that exercise everything EXCEPT the repository layer they exist to
            # provide — `adapter-drizzle` reads 60.33% there and 75.42% here.
            # Both numbers are in coverage-baseline.json and both are checked;
            # this is the job that can check the second one.
            #
            # `--only` because this job builds the adapters and nothing else,
            # and measuring a package whose `dist/` was never built describes a
            # program nobody is running.
            - name: Coverage of the contract run
              env:
                  SAASICAT_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/saasicat_test
              run: >
                  node scripts/coverage-ratchet.mjs
                  --only=adapter-prisma,adapter-drizzle

    e2e:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5
            - name: Enable corepack
              run: corepack enable
            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build ui-vue and its workspace dependencies
              run: pnpm --filter "@saasicat/ui-vue..." build
            - name: Install Playwright browser
              run: pnpm --filter "@saasicat/ui-vue" exec playwright install --with-deps chromium
            - name: Run Playwright tests
              run: pnpm --filter "@saasicat/ui-vue" test:e2e
