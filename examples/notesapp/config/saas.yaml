schemaVersion: 1

app:
    name: NotesApp
    label: NotesApp Cockpit

currency: EUR
vatRate: 19.0

# What the tenant self-service routes are allowed to do, and on what terms.
# These live here and nowhere else: an operator reading this file has to be
# reading the values that are running. The file is read at boot, so an edit
# lands on the next restart.
tenantBilling:
    # How many days before the term ends a cancellation is still in time.
    # Zero means there is no door to be shut out of: a cancellation on the last
    # day still lands at the term end. Raise it and the cut is hard — a
    # declaration made after the window lands one full period later, which on a
    # yearly cycle is a year.
    #
    # Two rhythms, two numbers, and both are required. A month and a year
    # cannot share a notice period, and a rhythm left out would read as zero:
    # a commercial decision nobody made.
    #
    # Any value here may name an environment variable, `monthly: ${NOTICE_DAYS}`
    # or with a default `${NOTICE_DAYS:-0}`, so one file serves every
    # environment. It is resolved before the schema checks it, so the rules
    # above still hold; a variable nobody set stops the boot and names itself.
    cancellationNoticeDays:
        monthly: 0
        yearly: 0
    # Plans a tenant may not reach or leave on its own. Empty here, and empty
    # on purpose rather than by omission: this example sells every plan through
    # self-service.
    selfServiceBlockedPlans:
        asTarget: []
        asSource: []

marketing:
    availableLocales: [en]

# Who is mailed when a start finds the settings above changed since the previous
# start. The change is recorded in the administration either way; mail needs an
# email port bound as `adapters.email`, and without one the boot log says once
# that the addresses reach nobody. Nobody is named here on purpose: this example
# binds no mail, and an installation of one operator needs nothing else.
#
#   notifications:
#       settingsChanged: [ops@example.com]

# The operator's side of every contract this installation concludes. A contract
# copies it on the day it is concluded, so it keeps naming its counterparty after
# this block changes. Only the legal name is required until invoicing requires
# the rest. The company here is an example, not a real one.
#
# The address moves freely. The legal name and the tax identifiers are the party
# a contract names, so changing one of them refuses the next start unless the
# file declares the change a correction of the same legal entity, naming the
# value it replaces — `null` where none was recorded — and why:
#
#   issuer:
#       legalName: NotesApp Example AG
#       correctionOf:
#           legalName: NotesApp Example GmbH
#           reason: Change of legal form, registered 2026-07-01
#
# It is needed only for the start that carries the change. Another legal entity
# taking over is a transfer, not an edit of this file.
issuer:
    legalName: NotesApp Example GmbH
    addressLine1: Beispielstraße 1
    postalCode: '10115'
    city: Berlin
    country: DE
    vatId: DE000000000

# Put in front of every customer number assigned from the next start on. A
# number keeps the prefix it was assigned with, so changing this renumbers
# nobody.
subscribers:
    customerNumberPrefix: K-

# The payment gateway accounts payment methods are taken through, by the name
# their webhook route carries: /webhooks/payment/<name>. SaaSiCat keeps the
# gateway's reference to a card or a direct debit mandate, never the number.
#
# This example binds the development gateway, which confirms every payment
# method on the spot without a provider behind it and refuses to run with
# NODE_ENV=production. An installation that takes real payment methods names its
# provider's account here instead and binds that provider's gateway adapter,
# with its keys from the environment. An account keeps its entry for as long as
# a payment method in use belongs to it.
payments:
    newPaymentMethods: dev
    # Where the gateway's form may send a person back to: the tenant web app, in
    # the container and on the Vite dev server. Any other success or cancel URL
    # is refused.
    returnUrlOrigins:
        - http://localhost:8080
        - http://localhost:9200
    accounts:
        dev:
            provider: dev
            methods: [card, sepa_debit]

# Static quickstart path: plans live directly in the YAML. Apps that manage
# plans in the SuperAdmin UI omit this block and use the DB catalog instead
# (SaaSiCatModule.forRoot({ persistence, dbCatalog: { path: 'config/saas.yaml' } }))
# — the settings above stay in this file either way.
plans:
    - id: STARTER
      name: Starter
      monthlyNet: 9
      yearlyNet: 90
      features: [NOTES]
      quotas:
          notesMax: 25
    - id: PRO
      name: Pro
      popular: true
      monthlyNet: 29
      yearlyNet: 290
      features: [NOTES, NOTES_EXPORT]
      quotas:
          notesMax: 1000
