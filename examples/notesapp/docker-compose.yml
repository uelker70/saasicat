# Runnable notesapp stack: Postgres, the NestJS backend and the SuperAdmin UI.
#
#   docker compose -f examples/notesapp/docker-compose.yml up --build
#
# Then open http://localhost:9000 and sign in with the seeded demo account
# (admin@notesapp.example / demo — printed by the seed on startup).
#
# Every published port has a `*_HOST_PORT` override in .env (see .env.example);
# the ports inside the containers are fixed, because nginx.conf and the compose
# network address the services by name.
#
# Both images build from the repo root, because the app and the admin consume
# the `@saasicat/*` workspace packages from source.

name: notesapp

services:
    db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: notesapp
            POSTGRES_PASSWORD: notesapp
            POSTGRES_DB: notesapp

        # Host port only — inside the compose network the backend always talks
        # to db:5432. Override `DB_HOST_PORT` in .env when another project
        ports:
            - '${DB_HOST_PORT:-5432}:5432'
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U notesapp -d notesapp']
            interval: 5s
            timeout: 5s
            retries: 20

    backend:
        build:
            context: ../..
            dockerfile: examples/notesapp/Dockerfile
        environment:
            DATABASE_URL: postgresql://notesapp:notesapp@db:5432/notesapp
            SETUP_TOKEN: demo-setup-token
            PORT: '3000'
            # Set to false to keep data you changed through the UI across restarts.
            SEED_ON_START: 'true'

        # Host port only, for the curl walkthrough in the README — override
        # `BACKEND_HOST_PORT` in .env when 3000 is taken. The admin and web
        # containers reach the backend as `backend:3000` over the compose
        # network (see their nginx.conf), so the port inside stays 3000.
        ports:
            - '${BACKEND_HOST_PORT:-3000}:3000'
        depends_on:
            db:
                condition: service_healthy

    admin:
        build:
            context: ../..
            dockerfile: examples/notesapp/admin/Dockerfile
        # Host port only — nginx inside the container always listens on 80.
        ports:
            - '${ADMIN_HOST_PORT:-9000}:80'
        depends_on:
            - backend

    web:
        build:
            context: ../..
            dockerfile: examples/notesapp/web/Dockerfile
        # Host port only — nginx inside the container always listens on 80.
        ports:
            - '${WEB_HOST_PORT:-8080}:80'
        depends_on:
            - backend

volumes:
    db-data:
