packages:
    - 'packages/*'
    # Workspace tooling. Private, never published — the fixed group is
    # `packages/*` and `every-published-package-is-in-the-fixed-group` reads it
    # from there.
    - 'tools/*'
    - 'examples/*'
    - 'examples/*/admin'
    - 'examples/*/web'
overrides:
    # GHSA-mh99-v99m-4gvg: unbounded brace expansion crashes the process. The fix
    # only landed on the 5.x line, so minimatch@9 — whose 2.x dependency has no
    # patched release — is lifted to minimatch@10 instead of patched in place.
    'brace-expansion@^5.0.0': '^5.0.8'
    'minimatch@^9.0.0': '^10.2.5'
    # GHSA-g7r4-m6w7-qqqr: path traversal in the esbuild dev server. Pulled in
    # transitively by tsup, which still pins ^0.27.0.
    esbuild: '^0.28.1'
    # Transitive build-tool dependencies with patched releases available.
    # Keeping the overrides on the existing majors avoids unrelated migrations.
    # GHSA-fxqj-rqcc-2cmp: inefficient parsing in PostCSS.
    postcss: '^8.5.23'
    # GHSA-7p8r-x3mc-p8w7: denial of service in fast-uri URI parsing.
    fast-uri: '^3.1.5'
    # GHSA-2v37-7h3g-55p8: predictable Nano ID generation with non-integer size.
    nanoid: '^3.3.17'
    # GHSA-p2gr-x3f9-5xw5: stack exhaustion merging recursive object graphs.
    # Reached only through the Prisma CLI's config loader, which pins 7.1.5
    # exactly, so this lifts it across a major. What that loader merges is the
    # developer's own prisma.config.ts rather than anything a tenant supplies —
    # the override is here because a known-vulnerable version in the tree is
    # worth removing, not because the path is reachable from a request.
    deepmerge-ts: '^8.0.2'
allowBuilds:
    '@nestjs/core': true
    # Native file watcher pulled in by the admin dev tooling; the JS fallback is
    # fine and keeps the container image free of a build toolchain.
    '@parcel/watcher': false
    # Prisma postinstall downloads the query/schema engines — required for the
    # adapter-prisma integration tests (prisma db push + generate).
    '@prisma/client': true
    '@prisma/engines': true
    '@swc/core': true
    esbuild: true
    prisma: true
